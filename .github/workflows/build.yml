name: Build APK

# Actions 탭에서 수동으로 실행하거나, main 브랜치에 push할 때마다 자동 실행됩니다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: 필요한 SDK 패키지 설치
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 설치 (프로젝트에 gradlew가 없어도 됨)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: 디버그 APK 빌드
        run: gradle assembleDebug

      - name: 빌드된 APK 업로드 (Actions 탭에서 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
