plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.zetaoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zetaoverlay"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // 저장소에 포함된 고정 디버그 키. 이게 없으면 빌드할 때마다(특히 GitHub Actions처럼
            // 매번 새 서버에서 빌드할 때) 서명이 랜덤하게 바뀌어서, 업데이트할 때마다
            // 기존 앱을 지우고 재설치해야 하는 문제가 생긴다.
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
